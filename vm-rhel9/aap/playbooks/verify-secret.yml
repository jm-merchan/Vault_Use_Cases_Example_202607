---
- name: Verify secret delivery from Vault on RHEL VMs
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Verify the injected value without displaying it
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'AAP_VAULT_DEMO_SECRET') | length > 0
          - lookup('ansible.builtin.env', 'AAP_VAULT_DEMO_SECRET') | hash('sha256') == aap_expected_digest
        quiet: true
      no_log: true

    - name: Report the verification outcome
      ansible.builtin.debug:
        msg: "Vault VM secret retrieved and verified. Authentication: {{ aap_auth_method }}"
